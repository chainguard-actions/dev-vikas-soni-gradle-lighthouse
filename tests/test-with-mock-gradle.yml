name: Test with mock Gradle producing Lighthouse reports
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gradlew that produces Lighthouse report files
        run: |
          # Create mock gradlew that generates the expected output files
          mkdir -p "$GITHUB_WORKSPACE/build/reports/lighthouse"

          # Create a minimal SARIF report file
          cat > "$GITHUB_WORKSPACE/build/reports/lighthouse/module-report.sarif" <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Gradle Lighthouse",
                    "version": "1.0.0",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF

          # Create the module-report.json with a score
          cat > "$GITHUB_WORKSPACE/build/reports/lighthouse/module-report.json" <<'EOF'
          {
            "score": 85,
            "checks": []
          }
          EOF

          # Create a fake gradlew that just exits successfully
          cat > "$GITHUB_WORKSPACE/gradlew" <<'GRADLEW'
          #!/bin/bash
          echo "Mock Gradle Lighthouse Audit running..."
          echo "lighthouseAudit: OK"
          echo "lighthouseAggregate: OK"
          echo "BUILD SUCCESSFUL"
          exit 0
          GRADLEW
          chmod +x "$GITHUB_WORKSPACE/gradlew"

          echo "Mock setup complete"

      - id: action
        uses: .
        continue-on-error: true
        with:
          fail-on-severity: 'NONE'
          upload-sarif: 'false'
          comment-on-pr: 'false'

      - name: Assert action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on SARIF upload availability
          # but it should not have an unexpected outcome
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Find SARIF reports manually and verify
        run: |
          echo "Checking for SARIF report files..."
          SARIF_FILES=$(find . -path '*/reports/lighthouse/*.sarif' | head -20)
          echo "Found SARIF files: $SARIF_FILES"
          if [ -z "$SARIF_FILES" ]; then
            echo "FAIL: No SARIF files found"
            exit 1
          fi
          echo "PASS: SARIF files found"

      - name: Verify score extraction from module-report.json
        run: |
          echo "Checking module-report.json..."
          if [ ! -f "build/reports/lighthouse/module-report.json" ]; then
            echo "FAIL: module-report.json not found"
            exit 1
          fi
          SCORE=$(grep -o '"score": [0-9]*' build/reports/lighthouse/module-report.json 2>/dev/null | head -1 | grep -o '[0-9]*' || echo "N/A")
          echo "score: $SCORE"
          if [ "$SCORE" = "85" ]; then
            echo "PASS: score extracted correctly as 85"
          else
            echo "FAIL: expected score 85, got '$SCORE'"
            exit 1
          fi
