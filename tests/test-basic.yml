name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock gradlew
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-gradlew.sh" "$GITHUB_WORKSPACE/gradlew"
          chmod +x "$GITHUB_WORKSPACE/gradlew"

      - id: action
        uses: .
        with:
          upload-sarif: 'false'
          comment-on-pr: 'false'
          fail-on-severity: 'NONE'

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"

      - name: Assert JSON report file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/build/reports/lighthouse/module-report.json" ]; then
            echo "FAIL: module-report.json not found"
            exit 1
          fi
          echo "PASS: module-report.json exists"

      - name: Assert SARIF file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/build/reports/lighthouse/module-report.sarif" ]; then
            echo "FAIL: module-report.sarif not found"
            exit 1
          fi
          echo "PASS: module-report.sarif exists"

      - name: Assert score in JSON report
        run: |
          SCORE=$(grep -o '"score": [0-9]*' "$GITHUB_WORKSPACE/build/reports/lighthouse/module-report.json" | head -1 | grep -o '[0-9]*')
          echo "score: $SCORE"
          if [ "$SCORE" = "85" ]; then
            echo "PASS: score correctly set to 85"
          else
            echo "FAIL: expected score 85 but got: $SCORE"
            exit 1
          fi

      - name: Assert SARIF file matches find pattern used by action
        run: |
          FOUND=$(find . -path '*/reports/lighthouse/*-report.sarif' | head -20)
          echo "SARIF files found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: no SARIF files found matching pattern '*/reports/lighthouse/*-report.sarif'"
            exit 1
          fi
          echo "PASS: SARIF file found: $FOUND"
